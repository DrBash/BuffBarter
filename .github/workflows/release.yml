name: Package and upload

# Push a tag like v1.0.0 to build the zip and upload it to CurseForge.
# Tags with "beta" or "alpha" in the name are uploaded as beta or alpha files.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # the packager reads CF_API_TOKEN (older versions: CF_API_KEY)
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
